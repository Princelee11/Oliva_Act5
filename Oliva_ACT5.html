<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - My Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { 
            padding-top: 56px; 
            background-color: #f8f9fa; 
        }
        .register-section {
            padding: 80px 0;
        }
        .card {
            border: none;
        }
    </style>
</head>
<body>

   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">MY PORTFOLIO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

  
    <section class="register-section">
        <div class="container">
            <h2 class="text-center mb-4">Create an Account</h2>
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card p-4 shadow-sm bg-white rounded">
                        
                        
                        <form action="login.html" method="GET">
                            
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter full name" required>
                            </div>

                           
                            <div class="mb-3">
                                <label class="form-label fw-bold">Username</label>
                                <input type="text" class="form-control" placeholder="Choose a username" required>
                            </div>

                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter email" required>
                            </div>

                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" placeholder="Create password" required>
                            </div>

                           
                            <div class="mb-4">
                                <label class="form-label fw-bold">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="Confirm password" required>
                            </div>

                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
                        </form>

                        
                        <div class="text-center mt-2">
                            <p class="mb-0 text-muted">
                                Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login here</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>

    
    <footer class="text-center py-4 bg-dark text-white fixed-bottom d-none d-md-block">
        <p class="mb-0">© 2026 Glenn Angelo | All Rights Reserved</p>
    </footer>

    
    <script src="https://jsdelivr.net"></script>
</body>
